name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]  # Замените на вашу основную ветку, если это не main
  workflow_dispatch:   # Позволяет запускать вручную из интерфейса GitHub

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm' # или 'yarn', если используете Yarn
      - name: Install dependencies
        run: npm ci # или 'yarn install --frozen-lockfile'
      - name: Build project
        run: npm run build # или 'yarn build'
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Укажите вашу папку со сборкой (для Vite) или ./build (для CRA)

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
